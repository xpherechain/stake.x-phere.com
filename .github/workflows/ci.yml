name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned so a red CI means our code broke, not that foundry shipped a
      # release overnight. The 1.8.0 build tightened vm.prank and turned two
      # suites red here without a commit of ours; settle.yml was taken out the
      # same week by the same unpinned action.
      #
      # The suite passes on 1.8.0 as well, so this can be raised whenever —
      # just run the tests against the new build before doing it.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: forge build
        run: forge build --sizes

      - name: forge test
        run: forge test -vv

      # The cap moves through the timelock every few months and has to land in
      # config.js, the page copy and the FAQ JSON-LD together. Missing one is
      # invisible in a browser, because the data-cap spans rewrite themselves
      # on load and hide the stale HTML underneath.
      - name: web copy matches the configured cap
        run: python3 script/check-web-consistency.py
