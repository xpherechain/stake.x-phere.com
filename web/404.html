    <style>
      :root {
        --ink: #000;
        --line: #262626;
        --ash: #8a8a8a;
        --bone: #ededed;
        --cream: #ffeed4;
        --ember: #e7453a;
        --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
        --sans: -apple-system, "Pretendard Variable", Pretendard, system-ui, sans-serif;
        --brand-gradient: linear-gradient(to right, #ffeed4 0%, #ff9738 9%, #e7453a 47%, #cf1512 100%);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--ink);
        color: var(--bone);
        font-family: var(--sans);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .code {
        font-family: var(--mono);
        font-size: clamp(64px, 18vw, 140px);
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.04em;
        background: var(--brand-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { font-size: clamp(20px, 4vw, 28px); font-weight: 600; margin: 20px 0 10px; }
      p { color: var(--ash); font-size: 15px; line-height: 1.6; max-width: 42ch; margin: 0 auto; }
      .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
      a {
        font-family: var(--mono);
        font-size: 13px;
        text-decoration: none;
        color: var(--bone);
        border: 1px solid var(--line);
        padding: 11px 18px;
        border-radius: 999px;
        transition: border-color 0.18s, color 0.18s;
      }
      a:hover { border-color: var(--ember); color: var(--cream); }
      a.primary { background: var(--brand-gradient); color: #140401; border-color: transparent; font-weight: 600; }
    </style>
